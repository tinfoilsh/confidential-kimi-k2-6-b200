cvm-version: 0.10.2
cpus: 32
gpus: 8
memory: 524288

models:
  - name: "kimi-k2-6"
    repo: "nvidia/Kimi-K2.6-NVFP4@2fd3a800dedd098b8327eb49e93ebc75f85da19f"
    mpk: "23653f0bad86c7ad6d4994a2607858662c56ed3ba205252f5714ba8636db35f8_595219173376_907a1c65-6c08-5c3c-9efa-e564282c7da0"

containers:
  - name: "kimi-k2-6"
    image: "vllm/vllm-openai:v0.22.0@sha256:0fec7ec5f3e6bc168e54899935fb0557da908a4832a1dbc88e2debcf2f889416"
    runtime: nvidia
    gpus: all
    shm_size: "64g"
    restart: always
    pids_limit: 65536
    read_only: false
    cap_add:
      - IPC_LOCK
      - SYS_RESOURCE
      - SYS_NICE
    env:
      - VLLM_USE_FLASHINFER_MOE_FP4: "1"
      - PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    command: [
      "--model", "/tinfoil/mpk/mpk-23653f0bad86c7ad6d4994a2607858662c56ed3ba205252f5714ba8636db35f8",
      "--tensor-parallel-size", "8",
      "--kv-cache-dtype", "fp8",
      "--enable-expert-parallel",
      "--gpu-memory-utilization", "0.95",
      "--max-num-seqs", "48",
      "--enable-chunked-prefill",
      "--mm-encoder-tp-mode", "data",
      "--reasoning-parser", "kimi_k2",
      "--tool-call-parser", "kimi_k2",
      "--enable-auto-tool-choice",
      "--trust-remote-code",
      "--served-model-name", "kimi-k2-6",
      "--port", "8001",
      "--scheduling-policy", "priority",
    ]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      start_period: 60m
    tmpfs:
      /tmp: size=512m,mode=1777,exec
      /root: size=2g,mode=0700,exec

shim:
  upstream-port: 8001
  authenticated: true
  authenticated-endpoints:
    - /v1/chat/completions
    - /v1/responses
  paths:
    - /v1/chat/completions
    - /v1/responses
    - /metrics
    - /health
